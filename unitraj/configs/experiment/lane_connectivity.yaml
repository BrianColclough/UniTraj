# @package _global_

# Shared settings of the lane-connectivity study: AutoBot on Argoverse 2 motion forecasting.
# A run is specified by a condition and a seed, everything else is the same for all runs:
#   python train.py +experiment=lane_connectivity condition=structured seed=1

defaults:
  - override /method: autobot

study: main # names the grid, runs with the same condition and seed in different studies do not collide
exp_name: ${condition}_seed${seed}
seed: 0
debug: False

# everything large lives outside the repository
data_root: ${oc.env:LANE_CONNECTIVITY_DATA,${oc.env:HOME}/data/lane-connectivity}
output_dir: ${data_root}/runs/${study}/${exp_name}
cache_path: ${data_root}/cache
train_split: train
val_split: val
train_data_path: [ "${data_root}/scenarionet/${train_split}/av2" ]
val_data_path: [ "${data_root}/scenarionet/${val_split}/av2" ]
load_num_workers: 8

# Argoverse 2 gives 5s of history at 10Hz and asks for the next 6s
past_len: 50
future_len: 60
starting_frame: [ 0 ]

eval: True # log the trajectory type and Kalman difficulty splits at every validation epoch

hydra:
  run:
    dir: ${output_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
